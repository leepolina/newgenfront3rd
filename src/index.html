<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Booster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <a href="./index.html" class="header_logo"
        ><img class="header_logo-img" src="./img/logo.png" alt="logo"
      /></a>
      <div class="container">
        <h2 class="header_title">
          FIND BEST EVENTS <br />
          AROUND THE WORLD
        </h2>
        <ul class="header_list">
          <li class="header_item">
            <input
              class="header_input"
              type="text"
              placeholder="Start searching"
            />
            <svg class="header_svg">
              <use
                class="header_icon"
                href="./img/symbol-defs.svg#icon-search"
              ></use>
            </svg>
          </li>
          <li class="header_item">
            <input
              class="header_input"
              type="text"
            
              placeholder="Choose country"
            />
            <svg class="header_svg">
              <use
                class="header_icon"
                href="./img/symbol-defs.svg#icon-arrow"
              ></use>
            </svg>
            <ul class="header_list-country"></ul>
          </li>
        </ul>
      </div>
    </header>
    <main class="main">
     
    </main>
    <footer class="footer container">
      <p class="footer_text">
        © 2021 | All Rights Reserved | <br>Developed with ♥ by GoIT Students
      </p>
    </footer>
    <footer class="footer"></footer>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
